plugins {
    id 'com.android.application'
}

android {
    namespace 'de.uni.getraenke'
    compileSdk 35

    defaultConfig {
        applicationId 'de.uni.getraenke'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '1.4'
    }

    // Fester Schlüssel im Repo, damit spätere Versionen sich über die alte
    // installieren lassen (keine Geheimnisse, nur eine private Hobby-App).
    signingConfigs {
        release {
            storeFile file('getraenke.keystore')
            storePassword 'getraenke'
            keyAlias 'getraenke'
            keyPassword 'getraenke'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
